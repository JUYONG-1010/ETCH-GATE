[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "etch-gate"
version = "0.1.0"
description = "Lot-aware virtual metrology for BOSCH plasma etching"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.9,<4",
  "netCDF4>=1.7,<2",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scripts/create_final_paper.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
